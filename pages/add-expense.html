<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense</title>

<link rel="stylesheet" href="../style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="app-container">

<header class="header">

<h1>Add Expense</h1>

<p class="subtitle">Record shop expense</p>

</header>


<div class="form-container">

<label for="expenseAmount">Expense Amount</label>

<input
type="number"
id="expenseAmount"
placeholder="Enter expense amount"
required
>


<label for="expensePayment">Payment Method</label>

<select id="expensePayment">

<option value="cash">Cash</option>

<option value="online">Online</option>

</select>


<label for="expenseCategory">Category</label>

<select id="expenseCategory">

<option value="kirana">Kirana</option>

<option value="electricity">Electricity</option>

<option value="home">Home</option>

<option value="travel">Travel</option>

<option value="other">Other</option>

</select>


<label for="expenseNote">Note (Optional)</label>

<textarea
id="expenseNote"
placeholder="Write note if needed"
rows="3"
></textarea>


<button
class="danger-btn"
id="saveExpenseBtn"
onclick="saveExpense()"
>

Save Expense

</button>


<a href="../index.html">

<button class="secondary-btn">

Back to Dashboard

</button>

</a>

</div>

</div>


<script type="module" src="../js/expense.js"></script>

</body>
</html>
